name: Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Prepare central release artifacts after checks (sign and publish locally)
        type: boolean
        default: false
      reuse_run_id:
        description: Optional completed run with a successful build; only workflow-only changes may follow it
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Reject private data files
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object { $_ -match '(^|/)\.env|\.db($|-)|\.sqlite|\.pem$|\.key$|(^|/)(backups|product_documents|AileFinans)/' }
          if ($bad) { throw "Private data files must not be tracked: $bad" }
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Source startup check
        shell: pwsh
        run: |
          python ailefinans.py --smoke-test "$env:RUNNER_TEMP\smoke-source.json"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP\smoke-source.json")) { throw "Source startup check failed" }
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean ParaNoya.spec
      - name: Verify standalone update helper
        # Build and run the isolated helper before distributing it.
        # It validates its embedded config without network or finance access.
        shell: pwsh
        run: |
          $helper = Join-Path $PWD 'dist\ParaNoya\ParaNoyaUpdater.exe'
          if (!(Test-Path $helper)) { throw 'Update helper missing' }
          $p = Start-Process -FilePath $helper -ArgumentList @('--self-test', '--self-test-report', 'helper-report.json') -WindowStyle Hidden -PassThru -RedirectStandardOutput helper-out.txt -RedirectStandardError helper-error.txt
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'Update helper timed out' }
          Get-Content helper-out.txt, helper-error.txt
          if ($p.ExitCode -ne 0) { throw 'Update helper self test failed' }
          $report = Get-Content helper-report.json -Raw | ConvertFrom-Json
          if (!$report.ok -or $report.launcher_pid -ne $p.Id) { throw 'Update helper process identity failed' }
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 missing from Windows runner" }
          $source = Get-Content installer\ParaNoya.iss -Raw
          $match = [regex]::Match($source, '#define AppVersion "([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)"')
          if (!$match.Success) { throw "Installer AppVersion missing" }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw "Tag/version mismatch" }
          & $iscc "/DAppVersion=$version" installer\ParaNoya.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Verify executable icon resources
        shell: pwsh
        run: python verify_windows_icons.py dist\ParaNoya\ParaNoya.exe (Get-Item installer-output\*-Setup.exe).FullName
      - name: Verify install, startup, upgrade and uninstall
        shell: pwsh
        run: |
          $setup = (Get-Item installer-output\*-Setup.exe).FullName
          $install = Join-Path $env:RUNNER_TEMP 'ParaNoya-installed'
          $report = Join-Path $env:RUNNER_TEMP 'smoke-installed.json'
          $log = Join-Path $env:RUNNER_TEMP 'installer.log'
          foreach ($pass in 1..2) {
            $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$install", "/LOG=$log") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
          }
          $p = Start-Process -FilePath "$install\ParaNoya.exe" -ArgumentList @('--smoke-test', $report) -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'Installed app timed out' }
          if ($p.ExitCode -ne 0 -or !(Test-Path $report)) { throw "Installed app check failed: $($p.ExitCode)" }
          if (!(Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Invalid startup report' }
          python -c "import os; from pathlib import Path; from installed_app import trusted_install_folder, install_options; folder=Path(os.environ['RUNNER_TEMP'])/'ParaNoya-installed'; assert trusted_install_folder(folder/'ParaNoya.exe',os.environ['LOCALAPPDATA'])==folder.resolve(); assert install_options(folder)[0]=='user'"
          if ($LASTEXITCODE -ne 0) { throw 'Installed registry/path discovery failed' }
          $p = Start-Process -FilePath "$install\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path "$install\ParaNoya.exe") { throw 'App remains after uninstall' }
          Copy-Item $report installer-output\verification.json
          $file = Get-Item $setup
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  $($file.Name)" | Set-Content installer-output\SHA256SUMS.txt -Encoding ascii
          Write-Host "VERIFIED_INSTALLER_SHA256=$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())"
      - uses: actions/upload-artifact@v4
        with:
          name: ParaNoya-Windows-x64
          path: installer-output/*
          if-no-files-found: error
          retention-days: 30
  release:
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate artifact source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REUSE_RUN: ${{ inputs.reuse_run_id }}
        run: |
          source_sha="$COMMIT"
          if [[ -n "$REUSE_RUN" ]]; then
            [[ "$REUSE_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid source run'; exit 1; }
            gh api "repos/$GH_REPO/actions/runs/$REUSE_RUN" > /tmp/source-run.json
            jq -e '.status == "completed" and .path == ".github/workflows/windows-release.yml"' /tmp/source-run.json >/dev/null
            gh api "repos/$GH_REPO/actions/runs/$REUSE_RUN/jobs?per_page=100" > /tmp/source-jobs.json
            jq -e '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length == 1' /tmp/source-jobs.json >/dev/null
            source_sha=$(jq -r '.head_sha' /tmp/source-run.json)
            gh api "repos/$GH_REPO/compare/$source_sha...$COMMIT" > /tmp/source-diff.json
            jq -e '(.status == "identical" or .status == "ahead") and (.files | length <= 1) and all(.files[]; .filename == ".github/workflows/windows-release.yml" and .status == "modified")' /tmp/source-diff.json >/dev/null
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ParaNoya-Windows-x64
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
      - name: Prepare verified central release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.source.outputs.sha }}
          REF: ${{ github.ref }}
          ARTIFACT_RUN: ${{ inputs.reuse_run_id || github.run_id }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*#define AppVersion "([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/p' installer/ParaNoya.iss | head -n 1)
          test -n "$version" || { echo "Installer version missing"; exit 1; }
          tag="ParaNoya-v$version"
          if [[ "$REF" == refs/tags/* ]]; then
            test "${REF#refs/tags/}" = "v$version" || { echo "Tag/version mismatch"; exit 1; }
          fi
          test -f "release-assets/ParaNoya-$version-Windows-x64-Setup.exe"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          jq -e '.ok == true and .database == "temporary"' release-assets/verification.json >/dev/null
          jq -n --arg repository "$GH_REPO" --arg commit "$COMMIT" --arg run "$ARTIFACT_RUN" --arg version "$version" '{repository:$repository,source_commit:$commit,build_run_id:$run,version:$version}' > release-assets/build-provenance.json
          echo "Verified artifacts prepared for mburakharput/uygulama-guncellemeleri / $tag. Sign and publish locally with release_tools/Publish-ParaNoya.ps1."
      - uses: actions/upload-artifact@v4
        with:
          name: ParaNoya-Central-Release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
